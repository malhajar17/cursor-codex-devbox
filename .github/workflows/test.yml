name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test-bridge.cjs
      - run: node tests/test-extension-disposal.cjs
      - run: node --test tests/test-pane.cjs
      - run: python3 scripts/package_companion.py
